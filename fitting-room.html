<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피팅룸 | MENKHET</title>
    <!-- ?v=날짜(같은 날 또 고치면 뒤에 b · c …): CSS · JS · 아이콘을 고치면 같이 올림 → GitHub Pages가 파일을 10분씩 캐시해서 새 HTML에 예전 CSS가 섞여 깨져 보이던 것 막음 (2026-10-29) -->
    <link rel="stylesheet" href="styles/default.css?v=1029b">
    <link rel="stylesheet" href="styles/token.css?v=1029b">
    <link rel="stylesheet" href="styles/style.css?v=1029b">
    <script src="scripts/fitting-room.js?v=1029b" defer></script>
</head>

<body class="fitting-page">
    <!-- 시안 dim(1920×1080) 위에 피팅룸 창(수정 시안 231:1372, 700×900)이 뜬 화면 -->
    <main class="dim">
        <h1 class="blind">MENKHET 피팅룸</h1>

        <section class="fitting-room" aria-labelledby="fitting-room-title">
            <h2 class="blind" id="fitting-room-title">피팅룸</h2>

            <!-- 몸 정보: 칸 어디를 눌러도 갈매기표 아래로 목록이 열리고, 고르면 갈매기표 자리에 고른 값이 나옴 (갈매기표는 사라짐 — fitting-room.js)
                 성별을 골라야 키, 키를 골라야 몸무게 구간이 나옴 · 앞 칸을 다시 고르면 뒤 칸은 비고 갈매기표로 돌아감 · 고른 값은 이 화면에만 보여 주고 저장하거나 보내지 않음
                 셋 다 고르면 마네킹이 그 체형으로 바뀜 (조합 사진이 없는 체형은 코디 없는 기본 마네킹 — 여자 22 · 남자 36체형, 조합 사진 체형인 여자 160~165cm 네 구간(40~60kg)의 기본 마네킹은 예비로만 둠) -->
            <div class="body-info">
                <p class="guide">본인의 키와 몸무게를 넣어 주세요.</p>
                <div class="body-fields">
                    <div class="field sex">
                        <span class="label" id="sex-label">성별</span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="sex-label sex-selected" aria-expanded="false" aria-controls="sex-list"><span class="selected" id="sex-selected"></span></button>
                            <div class="select-drop">
                                <ul class="select-list" id="sex-list" hidden>
                                    <li><button type="button" class="option" data-value="female" aria-pressed="false">여자</button></li>
                                    <li><button type="button" class="option" data-value="male" aria-pressed="false">남자</button></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="field height">
                        <span class="label" id="height-label">키</span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="height-label height-selected" aria-expanded="false" aria-controls="height-list"><span class="selected" id="height-selected"></span></button>
                            <!-- 성별을 고르면 그 성별의 키 구간으로 바뀜 -->
                            <div class="select-drop">
                                <ul class="select-list" id="height-list" hidden>
                                    <li class="hint" tabindex="-1">성별을 먼저 골라 주세요</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="field weight">
                        <span class="label" id="weight-label">몸무게</span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="weight-label weight-selected" aria-expanded="false" aria-controls="weight-list"><span class="selected" id="weight-selected"></span></button>
                            <!-- 키를 고르면 그 키에 맞는 몸무게 구간으로 바뀜 -->
                            <div class="select-drop">
                                <ul class="select-list" id="weight-list" hidden>
                                    <li class="hint" tabindex="-1">키를 먼저 골라 주세요</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fitting-viewer">
                <div class="mannequin-box">
                    <!-- 마네킹: 코트 · 셔츠 · 바지 · 로퍼 3색씩 81가지 조합 사진(여자 160~165cm 40~60kg 네 체형, 고르기 전은 55~60kg, 코트 M) 중 옷 칸에서 고른 색의 사진,
                         조합 사진이 없는 체형(여자 · 남자)을 고르면 코디 없는 기본 마네킹 (fitting-room.js가 바꿈) -->
                    <img class="mannequin active" src="images/fitting/outfit/women/160-165cm/55-60kg/coat-black_shirt-skyblue_pants-black_loafers-black.webp" alt="코트 검정, 셔츠 하늘색, 바지 검정, 로퍼 검정 차림의 마네킹" width="683" height="1024">

                    <!-- 옷 칸: 지금 입은 색의 옷이 보이고, 누르면 오른쪽으로 색 3개가 펼쳐짐 → 색을 고르면 마네킹이 바뀌고 접힘
                         셔츠 · 바지 · 로퍼 칸은 사진 오른쪽 위에 '추천' 꼬리표 (시안 341:1693, 코트 칸은 없음) -->
                    <ul class="side-items">
                        <li class="side-item" data-part="coat">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/coat-black.webp" alt="코트 검정" width="200" height="300"></button></li>
                                <li><button type="button" class="side-option" data-color="ivory" aria-pressed="false"><img src="images/fitting/side/coat-ivory.webp" alt="코트 아이보리" width="200" height="300"></button></li>
                                <li><button type="button" class="side-option" data-color="brown" aria-pressed="false"><img src="images/fitting/side/coat-brown.webp" alt="코트 브라운" width="200" height="300"></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="shirt">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="skyblue" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/shirt-skyblue.webp" alt="셔츠 하늘색" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="white" aria-pressed="false"><img src="images/fitting/side/shirt-white.webp" alt="셔츠 흰색" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="false"><img src="images/fitting/side/shirt-black.webp" alt="셔츠 검정" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="pants">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/pants-black.webp" alt="바지 검정" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="skyblue" aria-pressed="false"><img src="images/fitting/side/pants-skyblue.webp" alt="바지 하늘색" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="gray" aria-pressed="false"><img src="images/fitting/side/pants-gray.webp" alt="바지 그레이" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="loafers">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/loafers-black.webp" alt="로퍼 검정" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="khaki" aria-pressed="false"><img src="images/fitting/side/loafers-khaki.webp" alt="로퍼 카키" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                                <li><button type="button" class="side-option" data-color="brown" aria-pressed="false"><img src="images/fitting/side/loafers-brown.webp" alt="로퍼 브라운" width="200" height="300"><span class="wear-tag">추천</span></button></li>
                            </ul>
                        </li>
                    </ul>
                </div>

                <!-- 사이즈: 칸을 고르면 고른 칸이 파랗게, 코트 사이즈 사진이 있는 차림이면 마네킹 코트도 바뀜 (처음은 M, 시안에서 숨긴 '추천' 꼬리표는 넣지 않음)
                     실측 그림 · '총장 ±2cm'는 시안에서 숨겨서 뺌 (2026-10-28 주인님 수정, 그림 SVG는 git 이력 · model/shirt-size-guides에 있음) -->
                <div class="size-panel" role="group" aria-labelledby="size-title">
                    <p class="size-title" id="size-title"><span class="name">봄버 재킷</span><span class="blind"> 사이즈</span></p>
                    <ul class="size-list">
                        <li><button type="button" class="size" data-size="s" aria-pressed="false">S</button></li>
                        <li><button type="button" class="size" data-size="m" aria-pressed="true">M</button></li>
                        <li><button type="button" class="size" data-size="l" aria-pressed="false">L</button></li>
                        <li><button type="button" class="size" data-size="xl" aria-pressed="false">XL</button></li>
                    </ul>
                    <!-- 장바구니 · 바로구매: 연결할 곳이 정해지기 전이라 동작 없음 (상품 상세 창 버튼과 같음) -->
                    <div class="size-actions">
                        <button type="button" class="btn-cart">장바구니 담기</button>
                        <button type="button" class="btn-buy">바로 구매하기</button>
                    </div>
                </div>
            </div>

            <!-- 닫기: 들어온 페이지(상품 상세)로 돌아감, 바로 열었으면 메인으로 -->
            <a class="btn-close" href="./">피팅룸 닫기</a>
        </section>
    </main>
</body>

</html>
