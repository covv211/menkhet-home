<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피팅룸 | MENKHET</title>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="stylesheet" href="styles/token.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/fitting-room.js" defer></script>
</head>

<body class="fitting-page">
    <!-- 시안 dim(1920×1080) 위에 피팅룸 창(수정 시안 231:1372, 700×900)이 뜬 화면 -->
    <main class="dim">
        <h1 class="blind">MENKHET 피팅룸</h1>

        <section class="fitting-room" aria-labelledby="fitting-room-title">
            <h2 class="blind" id="fitting-room-title">피팅룸</h2>

            <!-- 몸 정보: 칸 어디를 눌러도 갈매기표 아래로 목록이 열리고, 고른 값이 칸 이름 옆에 나옴 (fitting-room.js)
                 성별을 골라야 키, 키를 골라야 몸무게 구간이 나옴 · 고른 값은 이 화면에만 보여 주고 저장하거나 보내지 않음
                 셋 다 고르면 그 체형의 사진이 있을 때 마네킹이 그 체형으로 바뀜 (조합 사진이 없는 여자 체형은 코디 없는 기본 마네킹, 남자는 아직 기본 체형) -->
            <div class="body-info">
                <p class="guide">본인의 키와 몸무게를 넣어 주세요.</p>
                <div class="body-fields">
                    <div class="field sex">
                        <span class="label" id="sex-label">성별</span>
                        <span class="selected" id="sex-selected"></span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="sex-label sex-selected" aria-expanded="false" aria-controls="sex-list"></button>
                            <ul class="select-list" id="sex-list" hidden>
                                <li><button type="button" class="option" data-value="female" aria-pressed="false">여자</button></li>
                                <li><button type="button" class="option" data-value="male" aria-pressed="false">남자</button></li>
                            </ul>
                        </div>
                    </div>
                    <div class="field height">
                        <span class="label" id="height-label">키</span>
                        <span class="selected" id="height-selected"></span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="height-label height-selected" aria-expanded="false" aria-controls="height-list"></button>
                            <!-- 성별을 고르면 그 성별의 키 구간으로 바뀜 -->
                            <ul class="select-list" id="height-list" hidden>
                                <li class="hint" tabindex="-1">성별을 먼저 골라 주세요</li>
                            </ul>
                        </div>
                    </div>
                    <div class="field weight">
                        <span class="label" id="weight-label">몸무게</span>
                        <span class="selected" id="weight-selected"></span>
                        <div class="select">
                            <button type="button" class="toggle" aria-labelledby="weight-label weight-selected" aria-expanded="false" aria-controls="weight-list"></button>
                            <!-- 키를 고르면 그 키에 맞는 몸무게 구간으로 바뀜 -->
                            <ul class="select-list" id="weight-list" hidden>
                                <li class="hint" tabindex="-1">키를 먼저 골라 주세요</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fitting-viewer">
                <div class="mannequin-box">
                    <!-- 마네킹: 코트 · 셔츠 · 바지 · 로퍼 3색씩 81가지 조합 사진 중 옷 칸에서 고른 색의 사진, 셔츠 하늘색 · 바지 · 로퍼 검정이면 고른 사이즈의 코트 사진(처음 M),
                         조합 사진이 없는 여자 체형을 고르면 코디 없는 기본 마네킹 (fitting-room.js가 바꿈) -->
                    <img class="mannequin active" src="images/fitting/outfit/women/165-170cm/65-70kg/size/coat-black_m.webp" alt="코트 검정 M 사이즈, 셔츠 하늘색, 바지 검정, 로퍼 검정 차림의 마네킹" width="683" height="1024">

                    <!-- 옷 칸: 지금 입은 색의 옷이 보이고, 누르면 오른쪽으로 색 3개가 펼쳐짐 → 색을 고르면 마네킹이 바뀌고 접힘 -->
                    <ul class="side-items">
                        <li class="side-item" data-part="coat">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/coat-black.webp" alt="코트 검정" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="ivory" aria-pressed="false"><img src="images/fitting/side/coat-ivory.webp" alt="코트 아이보리" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="brown" aria-pressed="false"><img src="images/fitting/side/coat-brown.webp" alt="코트 브라운" width="94" height="140"></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="shirt">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="skyblue" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/shirt-skyblue.webp" alt="셔츠 하늘색" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="white" aria-pressed="false"><img src="images/fitting/side/shirt-white.webp" alt="셔츠 흰색" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="false"><img src="images/fitting/side/shirt-black.webp" alt="셔츠 검정" width="94" height="140"></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="pants">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/pants-black.webp" alt="바지 검정" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="skyblue" aria-pressed="false"><img src="images/fitting/side/pants-skyblue.webp" alt="바지 하늘색" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="gray" aria-pressed="false"><img src="images/fitting/side/pants-gray.webp" alt="바지 그레이" width="94" height="140"></button></li>
                            </ul>
                        </li>
                        <li class="side-item" data-part="loafers">
                            <ul class="side-options">
                                <li><button type="button" class="side-option" data-color="black" aria-pressed="true" aria-expanded="false"><img src="images/fitting/side/loafers-black.webp" alt="로퍼 검정" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="khaki" aria-pressed="false"><img src="images/fitting/side/loafers-khaki.webp" alt="로퍼 카키" width="94" height="140"></button></li>
                                <li><button type="button" class="side-option" data-color="brown" aria-pressed="false"><img src="images/fitting/side/loafers-brown.webp" alt="로퍼 브라운" width="94" height="140"></button></li>
                            </ul>
                        </li>
                    </ul>
                </div>

                <!-- 사이즈: 칸을 고르면 아래 실측 그림이 그 사이즈로 바뀌고, 코트 사이즈 사진이 있는 차림이면 마네킹 코트도 바뀜 (처음은 M, 시안에서 숨긴 '추천' 꼬리표는 넣지 않음) -->
                <div class="size-panel" role="group" aria-labelledby="size-title">
                    <p class="size-title" id="size-title"><span class="name">봄버 재킷</span><span class="blind"> 사이즈</span></p>
                    <ul class="size-list">
                        <li><button type="button" class="size" data-size="s" aria-pressed="false">S</button></li>
                        <li><button type="button" class="size" data-size="m" aria-pressed="true">M</button></li>
                        <li><button type="button" class="size" data-size="l" aria-pressed="false">L</button></li>
                        <li><button type="button" class="size" data-size="xl" aria-pressed="false">XL</button></li>
                    </ul>
                    <img class="size-guide active" src="images/fitting/size-guide-m.svg" alt="M(66) 실측: 어깨 39.5cm, 가슴단면 49cm, 허리단면 45cm, 총장 63.5cm, 소매길이 59cm, 소매통 17.5cm" width="143" height="160">
                    <p class="size-note">총장 ±2cm</p>
                    <!-- 장바구니 · 바로구매: 연결할 곳이 정해지기 전이라 동작 없음 (상품 상세 창 버튼과 같음) -->
                    <div class="size-actions">
                        <button type="button" class="btn-cart">장바구니 담기</button>
                        <button type="button" class="btn-buy">바로 구매하기</button>
                    </div>
                </div>
            </div>

            <!-- 닫기: 들어온 페이지(상품 상세)로 돌아감, 바로 열었으면 메인으로 -->
            <a class="btn-close" href="./">피팅룸 닫기</a>
        </section>
    </main>
</body>

</html>
